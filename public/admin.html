<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Nexora · Administration</title>
<style>:root{--bg:#060b1d;--s:#0e1830;--s2:#16254a;--tx:#e9eefc;--mu:#8b9bc4;--br:#5b9dff;--ln:#223562}*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
input{background:var(--s);border:1px solid var(--ln);color:var(--tx);padding:11px;border-radius:8px;width:100%;margin:5px 0}.btn{background:var(--br);color:#04102a;border:0;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.g{background:none;color:var(--tx);border:1px solid var(--ln)}
.box{background:var(--s);border-radius:14px;padding:18px;max-width:420px;margin:12vh auto}.wrap{display:grid;grid-template-columns:300px 1fr;height:100vh}@media(max-width:700px){.wrap{grid-template-columns:1fr}#chat{display:none}.wrap.open #list{display:none}.wrap.open #chat{display:flex}}
#list{border-right:1px solid var(--ln);overflow:auto}#chat{flex-direction:column;display:flex;min-height:0}.it{padding:12px 14px;border-bottom:1px solid var(--ln);cursor:pointer}.it:hover,.it.on{background:var(--s)}.mu{color:var(--mu);font-size:13px}.bd{background:#ff6b7d;color:#fff;border-radius:99px;padding:0 7px;font-size:12px;float:right}
#log{flex:1;overflow:auto;padding:14px}.m{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:75%;background:var(--s2)}.m.me{margin-left:auto;background:#1d4ed8}.bar{display:flex;gap:6px;padding:10px;border-top:1px solid var(--ln);flex-wrap:wrap}.bar input{flex:1;min-width:120px;margin:0}</style></head><body>
<div id="lg" class="box"><h2>Administration Nexora</h2><input id="em" type="email" placeholder="Email admin"><input id="pw" type="password" placeholder="Mot de passe"><input id="pin" type="password" placeholder="Code PIN"><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrer</button><p id="err" style="color:#ff6b7d;margin-top:8px"></p></div>
<div id="app" class="wrap" style="display:none"><div id="list"><div class="it row"><b>Clients</b> <button class="btn g" style="float:right" onclick="out()">Sortir</button></div><div id="th"></div></div>
<div id="chat"><div class="it" id="hd"><button class="btn g" onclick="document.querySelector('.wrap').classList.remove('open')">Retour</button> <b id="nm"></b></div><div id="log"></div>
<div class="bar"><input id="tx" placeholder="Votre réponse…"><button class="btn" onclick="send()">Envoyer</button></div>
<div class="bar"><input id="cr" type="number" placeholder="Créditer en $ USD" style="max-width:170px"><button class="btn g" onclick="act('credit',{usd:+$('cr').value})">Créditer</button><button class="btn g" onclick="act('formation',{status:'payee'})">Formation payée</button><button class="btn g" onclick="act('formation',{status:'terminee'})">Terminée (+200 €)</button></div><p id="e" class="mu" style="padding:0 10px 10px"></p></div></div>
<script>const $=id=>document.getElementById(id),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let T=sessionStorage.t,cur=null;
const FS={attente_paiement:'Paiement en attente',payee:'Formation active',terminee:'Formation terminée'};
function out(){sessionStorage.clear();location.reload()}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:o.body&&JSON.stringify(o.body)});const j=await r.json();if(r.status===401||r.status===403)out();if(!r.ok)throw new Error(j.error||'Erreur');return j}
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value,password:$('pw').value,pin:$('pin').value})}),j=await r.json();if(!r.ok)throw new Error(j.error);T=sessionStorage.t=j.token;start()}catch(e){$('err').textContent=e.message}}
function start(){$('lg').style.display='none';$('app').style.display='grid';tick();setInterval(tick,5000)}
async function tick(){const a=await api('/api/admin/threads');$('th').innerHTML=a.map(u=>`<div class="it ${u.id===cur?'on':''}" onclick="open_('${u.id}','${E(u.name).replace(/'/g,'')}')">${u.unread?`<span class="bd">${u.unread}</span>`:''}<b>${E(u.name)}</b><div class="mu">${E(u.email)} · ${E(u.country)}${u.formation?' · '+FS[u.formation.status]:''}</div><div class="mu">${u.last?E(u.last.text.slice(0,50)):'Aucun message'}</div></div>`).join('')||'<p class="mu" style="padding:14px">Aucun client.</p>';if(cur)load()}
async function load(){const a=await api('/api/admin/chat/'+cur),l=$('log'),b=l.scrollTop+l.clientHeight>=l.scrollHeight-40;l.innerHTML=a.map(m=>`<div class="m ${m.from==='admin'?'me':''}">${E(m.text)}</div>`).join('');if(b)l.scrollTop=1e9}
function open_(id,n){cur=id;$('nm').textContent=n;document.querySelector('.wrap').classList.add('open');load().then(()=>$('log').scrollTop=1e9)}
async function send(){const t=$('tx').value.trim();if(!t||!cur)return;$('tx').value='';await api('/api/admin/chat/'+cur,{method:'POST',body:{text:t}});load()}
async function act(k,b){if(!cur)return;try{await api('/api/admin/'+k+'/'+cur,{method:'POST',body:b});$('e').textContent='Fait.';load()}catch(e){$('e').textContent=e.message}}
if(T)start()</script></body></html>
